<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <div class="ad-bar">
            <p>إنها حقيقة! إجمالي الجوائز 1000 دولار!!!</p>
            <button class="ad-button">احصل</button>
        </div>
        <div class="logo">
            <img src="logo.png" alt="MOBET Logo">
            <h2>KEY</h2>
        </div>
        <input type="text" id="activation-code" placeholder="أدخل كود التفعيل">
        <button id="confirm-button" class="login-button">تأكيد</button>
        <div class="platforms">
            <label><input type="checkbox" checked> 1XBET</label>
            <label><input type="checkbox"> LINEBET</label>
            <label><input type="checkbox"> MELBET</label>
            <label><input type="checkbox"> Megapari</label>
            <label><input type="checkbox"> 888starz</label>
            <label><input type="checkbox"> BETWINNER</label>
        </div>
        <div class="icons">
            <img src="telegram.png" alt="Telegram">
            <img src="cart.png" alt="Cart">
            <img src="facebook.png" alt="Facebook">
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
